<!-- Scanner Box -->
<div (click)="onScanClick()"
     id="ScannerBox_Main"
     class="container d-flex flex-column align-items-center justify-content-center text-center text-secondary p-8 min-h-80 rounded-20 border-dashed border-3 mb-4"
     [class.scanning]="isScanning()"
     style="cursor: pointer">

  <div class="scanner-icon d-flex justify-content-center align-items-center w-20 h-20 gap-2 rounded-5 bg-light">
    @if (isScanning()) {
    <span class="spinner-border text-secondary" role="status" aria-hidden="true"></span>
    } @else {
    <img src="assets/Images/scan_main.svg" alt="Scan" />
    }
  </div>

  @if (isScanning()) {
  <h1 class="fw-semibold mt-2 text-dark">Scanning…</h1>
  <h2>Reading bracelet, please wait</h2>
  } @else {
  <h1 class="fw-semibold mt-2 text-dark">Ready to Scan</h1>
  <h2>Place the student's bracelet near the reader to start their order.</h2>
  }

  @if (errorMessage()) {
  <div class="alert alert-danger mt-3 mb-0 py-2 px-3 fs-14" role="alert">
    {{ errorMessage() }}
  </div>
  }
</div>
